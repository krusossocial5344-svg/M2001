</style></head><body><header><div><strong>⚔️ SOCIAL QUEST <span style="color:#7de0c1">/</span> สังคมศึกษา ม.2</strong><small>ภาคเรียนที่ 2 ปีการศึกษา 2569 · เกมการเรียนรู้</small></div><nav><button class="btn" id="map">🗺️ แผนที่</button><button class="btn" id="quiz">❔ คำถาม</button><button class="btn" id="full">⛶ เต็มจอ</button><button class="btn" id="reset">↺ เริ่มใหม่</button></nav></header><main class="layout"><div class="status"><span id="counter">1 / 12</span><div class="meter" aria-label="ความคืบหน้า"><div id="bar"></div></div><span id="score">⭐ 0</span></div><div class="stage" id="stage"><img id="slide" alt="ภาพสไลด์วิชาสังคมศึกษา" draggable="false"></div><div class="bottom"><button class="btn" id="prev">◀ ย้อนกลับ</button><span id="title"></span><button class="btn primary" id="next">ถัดไป ▶</button></div><p class="hint">ใช้ปุ่มลูกศรซ้าย/ขวาเพื่อเปลี่ยนสไลด์ · กด Q เปิดคำถาม · กด M เปิดแผนที่ · กด Esc ปิดหน้าต่าง</p></main><div class="overlay" id="modal" hidden><section class="panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="btn" id="close">ปิดหน้าต่าง ✕</button></section></div><script>
const slides=[{"title": "ยินดีต้อนรับสู่โลกสังคมศึกษา", "image": "assets/slide-01.webp", "question": "พร้อมออกผจญภัยไปกับโลกสังคมหรือยัง?", "choices": ["พร้อมแล้ว!", "ขอสำรวจแผนที่ก่อน"], "correct": 0, "explain": "ทุกคนเริ่มต้นเรียนรู้ได้ตามจังหวะของตนเอง"}, {"title": "แผนที่การผจญภัย", "image": "assets/slide-02.webp", "question": "ดินแดนใดใกล้ตัวเรามากที่สุด?", "choices": ["พลเมืองดี", "นักเศรษฐศาสตร์", "นักภูมิศาสตร์"], "correct": null, "explain": "ทุกดินแดนเกี่ยวข้องกับชีวิตประจำวัน ลองอธิบายเหตุผลของตนเอง"}, {"title": "สร้างตัวละครนักเรียนรู้", "image": "assets/slide-03.webp", "question": "ถ้าเลือกพลังพิเศษได้หนึ่งอย่าง จะเลือกอะไร?", "choices": ["คิดวิเคราะห์", "สื่อสารอย่างสร้างสรรค์", "ทำงานร่วมกัน", "รับผิดชอบต่อหน้าที่"], "correct": null, "explain": "ทุกทักษะสำคัญและพัฒนาได้"}, {"title": "ดินแดนแห่งประชาธิปไตย", "image": "assets/slide-04.webp", "question": "การเป็นพลเมืองดีเริ่มต้นจากอะไร?", "choices": ["เคารพสิทธิผู้อื่น", "ทำตามใจตนเองเสมอ", "ละเลยกฎร่วมกัน"], "correct": 0, "explain": "การเคารพสิทธิและรับผิดชอบต่อหน้าที่เป็นพื้นฐานของพลเมืองดี"}, {"title": "สิทธิหรือหน้าที่?", "image": "assets/slide-05.webp", "question": "จะเลือกข้อใด และเพราะเหตุใด?", "choices": ["A เก็บไว้เอง", "B ส่งคืนเจ้าของ"], "correct": 1, "explain": "การส่งคืนเจ้าของเป็นการเคารพสิทธิในทรัพย์สินของผู้อื่น"}, {"title": "ตลาดแห่งการตัดสินใจ", "image": "assets/slide-06.webp", "question": "ทำไมเราต้องเลือกเมื่อทรัพยากรมีจำกัด?", "choices": ["เพราะความต้องการมีมากกว่าทรัพยากร", "เพราะทรัพยากรไม่มีประโยชน์"], "correct": 0, "explain": "ทรัพยากรมีจำกัด จึงต้องจัดลำดับความสำคัญและตัดสินใจ"}, {"title": "เงิน 100 บาท ใช้อย่างไร?", "image": "assets/slide-07.webp", "question": "จะใช้เงินอย่างไรให้พอและมีเงินออม?", "choices": ["อาหาร 40 + อุปกรณ์ 30 + ออม 30", "อาหาร 40 + ของเล่น 50 + อุปกรณ์ 30", "ของเล่น 50 + อุปกรณ์ 30 + ออม 20"], "correct": null, "explain": "ลองจัดงบให้รวมไม่เกิน 100 บาทและเหลือเงินออม"}, {"title": "ออกสำรวจโลกกว้าง", "image": "assets/slide-08.webp", "question": "ภูมิประเทศส่งผลต่อชีวิตมนุษย์อย่างไร?", "choices": ["มีผลต่ออาชีพและการตั้งถิ่นฐาน", "ไม่มีผลต่อการดำรงชีวิต"], "correct": 0, "explain": "ภูมิประเทศและภูมิอากาศส่งผลต่ออาชีพ การเดินทาง และที่อยู่อาศัย"}, {"title": "นักสืบภูมิศาสตร์", "image": "assets/slide-09.webp", "question": "พื้นที่ใดเหมาะกับการปลูกข้าว เพราะอะไร?", "choices": ["A ทะเลทราย", "B ป่าฝน", "C ภูเขาหิมะ", "D ที่ราบลุ่ม"], "correct": 3, "explain": "ที่ราบลุ่มมีพื้นที่ราบและมักมีแหล่งน้ำ เหมาะกับการทำนา"}, {"title": "กฎแห่งกิลด์ห้องเรียน", "image": "assets/slide-10.webp", "question": "อยากเพิ่มข้อตกลงอะไรให้ห้องเรียนของเรา?", "choices": ["ช่วยเพื่อนเมื่อมีปัญหา", "รักษาความสะอาด", "รับฟังอย่างไม่ตัดสิน"], "correct": null, "explain": "ชวนกันเสนอข้อตกลงที่ทำได้จริงและทุกคนยอมรับ"}, {"title": "ศึกบอสความรู้", "image": "assets/slide-11.webp", "question": "ข้อใดเป็นตัวอย่างของหน้าที่พลเมือง?", "choices": ["เคารพกติกาส่วนรวม", "ใช้สิทธิโดยไม่สนใจผู้อื่น"], "correct": 0, "explain": "หน้าที่พลเมืองสัมพันธ์กับการเคารพสิทธิและการอยู่ร่วมกัน"}, {"title": "ปลดล็อกภารกิจสำเร็จ", "image": "assets/slide-12.webp", "question": "ภาคเรียนนี้อยากพัฒนาตัวเองเรื่องใด?", "choices": ["พลเมืองดี", "นักวางแผนเศรษฐกิจ", "นักสำรวจภูมิศาสตร์"], "correct": null, "explain": "เลือกเป้าหมายแล้วลงมือฝึกฝนต่อเนื่อง"}];let index=0;let answers={};try{const saved=JSON.parse(localStorage.getItem('socialQuestM2')||'{}');index=Math.max(0,Math.min(slides.length-1,saved.index||0));answers=saved.answers||{}}catch{}const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem('socialQuestM2',JSON.stringify({index,answers}))}catch{}};function render(){let s=slides[index];$('slide').src=s.image;$('slide').alt=s.title;$('counter').textContent=`${index+1} / ${slides.length}`;$('bar').style.width=`${(index+1)/slides.length*100}%`;$('title').textContent=s.title;$('score').textContent='⭐ '+Object.keys(answers).length*10;$('prev').disabled=index===0;$('next').textContent=index===slides.length-1?'กลับสู่จุดเริ่มต้น ↻':'ถัดไป ▶';save()}function go(n){index=(n+slides.length)%slides.length;render()}function modal(title,content){$('modalTitle').textContent=title;$('modalBody').replaceChildren(content);$('modal').hidden=false}function close(){ $('modal').hidden=true }function question(){const s=slides[index],wrap=document.createElement('div');const p=document.createElement('p');p.textContent=s.question;wrap.append(p);let feedback=document.createElement('div');feedback.className='feedback';s.choices.forEach((choice,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=choice;b.onclick=()=>{answers[index]=i;save();feedback.textContent=(s.correct===null?'💬 เปิดรับทุกคำตอบที่มีเหตุผล':i===s.correct?'✅ เยี่ยมมาก!':'💡 ลองพิจารณาอีกครั้ง')+' — '+s.explain;wrap.querySelectorAll('.choice').forEach(x=>x.disabled=true);render()};wrap.append(b)});wrap.append(feedback);if(answers[index]!==undefined)feedback.textContent='ตอบแล้ว: '+s.choices[answers[index]]+' — '+s.explain;modal('🎯 '+s.title,wrap)}function map(){let wrap=document.createElement('div');wrap.className='grid';slides.forEach((s,i)=>{let b=document.createElement('button');b.className='tile'+(answers[i]!==undefined?' done':'');b.textContent=`${i+1}. ${s.title} ${answers[i]!==undefined?'✓':''}`;b.onclick=()=>{go(i);close()};wrap.append(b)});modal('🗺️ แผนที่ภารกิจ',wrap)}$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('quiz').onclick=question;$('map').onclick=map;$('close').onclick=close;$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('reset').onclick=()=>{if(confirm('เริ่มใหม่และล้างคะแนนสะสมทั้งหมด?')){index=0;answers={};render()}};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return}if(!$('modal').hidden)return;if(e.key==='ArrowRight')go(index+1);if(e.key==='ArrowLeft')go(index-1);if(e.key.toLowerCase()==='q')question();if(e.key.toLowerCase()==='m')map()});render();
</script></body></html>
